name: Apply requested portfolio resume changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply only requested changes
        shell: python
        run: |
          from pathlib import Path

          p = Path('js/main.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("var value = 'Hi, I am Farhan. I am 30 years old.';", "var value = 'Hi, I am Farhan.';")

          marker = "  function start() {"
          if 'function resumeFeature()' not in s:
              feature = r'''  function resumeFeature() {
    var menu = one('#navMenu');
    if (menu && !one('#resumeNavLink')) {
      var item = document.createElement('li');
      item.innerHTML = '<a href="#resume" class="nav-link" id="resumeNavLink">Resume</a>';
      var cta = one('.nav-cta-item', menu);
      if (cta) menu.insertBefore(item, cta);
      else menu.appendChild(item);
    }

    var contact = one('#contact');
    if (!contact || one('#resume')) return;

    var section = document.createElement('section');
    section.className = 'section resume-section';
    section.id = 'resume';
    section.innerHTML = '<div class="container"><div class="section-head reveal"><span class="section-tag">Resume</span><h2 class="section-title">My <span class="gradient-text">Resume</span></h2><p class="section-desc">View and download my latest CV.</p></div><div class="resume-card glass reveal"><div class="resume-icon-wrap" aria-hidden="true"><span class="resume-icon">📄</span><span class="resume-orbit"></span></div><div class="resume-copy"><h3>Professional CV</h3><p>Download my CV to explore my skills, projects, education and experience.</p><a class="resume-download-btn" href="https://drive.google.com/uc?export=download&amp;id=11pEiuxXusP9ao330PAfVTm5fSGgGHzXS" target="_blank" rel="noopener noreferrer"><span>Download CV</span><span class="resume-arrow">↓</span></a></div></div></div>';
    contact.parentNode.insertBefore(section, contact);

    var style = document.createElement('style');
    style.textContent = '.resume-section .section-head{margin-bottom:34px}.resume-card{position:relative;display:flex;align-items:center;gap:28px;max-width:760px;margin:0 auto;padding:30px 34px;overflow:hidden;isolation:isolate;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s,box-shadow .45s}.resume-card::before{content:"";position:absolute;inset:-2px;background:linear-gradient(120deg,rgba(34,211,238,.16),transparent 35%,rgba(139,92,246,.18),transparent 70%,rgba(244,114,182,.12));z-index:-2;opacity:.8}.resume-card::after{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;background:rgba(34,211,238,.12);filter:blur(50px);z-index:-1;animation:resumeGlow 5s ease-in-out infinite alternate}.resume-card:hover{transform:translateY(-6px);border-color:rgba(34,211,238,.42);box-shadow:0 24px 70px rgba(34,211,238,.12),0 12px 35px rgba(139,92,246,.12)}.resume-icon-wrap{position:relative;width:86px;height:86px;flex:0 0 86px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(135deg,rgba(34,211,238,.18),rgba(139,92,246,.22));border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 0 25px rgba(255,255,255,.04),0 12px 35px rgba(139,92,246,.16)}.resume-icon{font-size:38px;filter:drop-shadow(0 6px 16px rgba(34,211,238,.25));animation:resumeFloat 3.4s ease-in-out infinite}.resume-orbit{position:absolute;inset:-7px;border:1px solid rgba(34,211,238,.24);border-radius:28px;animation:resumeOrbit 6s linear infinite}.resume-copy{flex:1}.resume-copy h3{font-family:var(--font-head);font-size:1.45rem;margin-bottom:6px}.resume-copy p{color:var(--text-muted);margin-bottom:20px}.resume-download-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:13px 22px;border-radius:12px;background:var(--grad);background-size:180% auto;color:#fff;font-family:var(--font-head);font-weight:700;box-shadow:0 10px 30px rgba(139,92,246,.28);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s,background-position .45s}.resume-download-btn::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.38),transparent);transform:skewX(-20deg);transition:left .65s var(--ease)}.resume-download-btn:hover{transform:translateY(-3px) scale(1.015);background-position:right center;box-shadow:0 16px 40px rgba(34,211,238,.28)}.resume-download-btn:hover::before{left:130%}.resume-arrow{font-size:1.15rem;line-height:1;transition:transform .35s var(--ease)}.resume-download-btn:hover .resume-arrow{transform:translateY(3px)}@keyframes resumeFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}@keyframes resumeOrbit{to{transform:rotate(360deg)}}@keyframes resumeGlow{to{transform:translate(-35px,35px) scale(1.15);opacity:.65}}@media(max-width:600px){.resume-card{flex-direction:column;text-align:center;padding:26px 20px}.resume-copy{width:100%}.resume-download-btn{width:100%}}';
    document.head.appendChild(style);
  }

'''
              s = s.replace(marker, feature + marker)

          s = s.replace('    header();\n    navigation();', '    header();\n    resumeFeature();\n    navigation();')
          p.write_text(s, encoding='utf-8')

          h = Path('index.html')
          hs = h.read_text(encoding='utf-8')
          hs = hs.replace('Hi, I am Farhan. I am 30 years old. AI Engineer and Developer.', 'Hi, I am Farhan. AI Engineer and Developer.')
          hs = hs.replace('Hi, I am Farhan. I am 30 years old.', 'Hi, I am Farhan.')
          h.write_text(hs, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/main.js index.html
          git diff --cached --quiet || git commit -m "Add resume tab and remove age from hero [skip ci]"
          git push
