name: Fix portfolio resume system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply resume changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # 1) Hero: remove age everywhere from the visible/accessibility text.
          p = Path('js/main.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("var value = 'Hi, I am Farhan. I am 30 years old.';", "var value = 'Hi, I am Farhan.';")
          p.write_text(s, encoding='utf-8')

          h = Path('index.html')
          s = h.read_text(encoding='utf-8')
          s = s.replace('Hi, I am Farhan. I am 30 years old. AI Engineer and Developer.', 'Hi, I am Farhan. AI Engineer and Developer.')
          s = s.replace('Hi, I am Farhan. I am 30 years old.', 'Hi, I am Farhan.')

          # 2) Add a real Resume nav item once, before the existing CTA.
          resume_nav = '<li><a href="#resume" class="nav-link" id="resumeNavLink">Resume</a></li>'
          if 'id="resumeNavLink"' not in s:
              marker = '<li class="nav-cta-item">'
              if marker not in s:
                  raise SystemExit('Could not find navbar CTA marker')
              s = s.replace(marker, resume_nav + marker, 1)

          # 3) Add a real Resume section before Contact once.
          if 'id="resume"' not in s:
              marker = '<section class="section" id="contact">'
              if marker not in s:
                  raise SystemExit('Could not find contact section marker')
              resume = '''<section class="section resume-section" id="resume"><div class="container"><div class="section-head reveal"><span class="section-tag">Resume</span><h2 class="section-title">My <span class="gradient-text">Resume</span></h2><p class="section-desc">View and download my latest CV.</p></div><div class="resume-card glass reveal"><div class="resume-icon-wrap" aria-hidden="true"><div class="resume-file-icon"><span></span><span></span><span></span></div><div class="resume-ring"></div></div><div class="resume-copy"><span class="resume-kicker">PROFESSIONAL CV</span><h3>My Resume</h3><p>Explore my skills, projects, education and experience in my latest CV.</p><a class="resume-download-btn" href="https://drive.google.com/uc?export=download&amp;id=11pEiuxXusP9ao330PAfVTm5fSGgGHzXS" target="_blank" rel="noopener noreferrer" download><span>Download CV</span><span class="resume-download-icon">↓</span></a></div></div></div></section>'''
              s = s.replace(marker, resume + marker, 1)

          h.write_text(s, encoding='utf-8')

          # 4) Premium resume styling. Only append once; nothing else is changed.
          css = Path('css/styles.css')
          c = css.read_text(encoding='utf-8')
          if '/* RESUME SYSTEM */' not in c:
              c += r'''

          /* RESUME SYSTEM */
          .resume-section .section-head{margin-bottom:34px}
          .resume-card{position:relative;display:flex;align-items:center;gap:30px;max-width:820px;margin:0 auto;padding:34px 38px;overflow:hidden;isolation:isolate;transition:transform .45s cubic-bezier(.22,1,.36,1),border-color .45s ease,box-shadow .45s ease}
          .resume-card:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(34,211,238,.10),transparent 32%,rgba(139,92,246,.14) 58%,transparent 82%);z-index:-2}
          .resume-card:after{content:"";position:absolute;width:280px;height:280px;right:-120px;top:-150px;border-radius:50%;background:rgba(34,211,238,.13);filter:blur(55px);z-index:-1;animation:resumeGlow 6s ease-in-out infinite alternate}
          .resume-card:hover{transform:translateY(-7px);border-color:rgba(34,211,238,.38);box-shadow:0 25px 75px rgba(34,211,238,.12),0 12px 38px rgba(139,92,246,.14)}
          .resume-icon-wrap{position:relative;width:92px;height:92px;flex:0 0 92px;display:grid;place-items:center;border-radius:25px;background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(139,92,246,.22));border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 0 28px rgba(255,255,255,.04),0 14px 40px rgba(139,92,246,.18)}
          .resume-file-icon{position:relative;width:43px;height:54px;border:2px solid rgba(255,255,255,.92);border-radius:7px;background:rgba(255,255,255,.05);box-shadow:0 8px 25px rgba(34,211,238,.18);animation:resumeFloat 3.2s ease-in-out infinite}
          .resume-file-icon:before{content:"";position:absolute;right:-2px;top:-2px;width:15px;height:15px;border-left:2px solid rgba(255,255,255,.92);border-bottom:2px solid rgba(255,255,255,.92);background:rgba(139,92,246,.35);clip-path:polygon(0 0,100% 100%,0 100%)}
          .resume-file-icon span{position:absolute;left:8px;width:22px;height:2px;border-radius:2px;background:rgba(255,255,255,.72)}
          .resume-file-icon span:nth-child(1){top:23px}.resume-file-icon span:nth-child(2){top:31px;width:18px}.resume-file-icon span:nth-child(3){top:39px;width:14px}
          .resume-ring{position:absolute;inset:-8px;border:1px solid rgba(34,211,238,.28);border-radius:30px;animation:resumeRing 7s linear infinite}
          .resume-copy{flex:1}.resume-kicker{display:inline-block;margin-bottom:7px;font-size:.72rem;letter-spacing:.16em;font-weight:700;color:#22d3ee}.resume-copy h3{font-family:var(--font-head);font-size:1.55rem;margin:0 0 7px}.resume-copy p{color:var(--text-muted);margin:0 0 20px;line-height:1.7}
          .resume-download-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:13px 22px;border-radius:13px;background:var(--grad);background-size:180% auto;color:#fff;font-family:var(--font-head);font-weight:700;box-shadow:0 11px 32px rgba(139,92,246,.28);overflow:hidden;transition:transform .35s var(--ease),box-shadow .35s ease,background-position .45s ease}.resume-download-btn:before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .7s var(--ease)}.resume-download-btn:hover{transform:translateY(-3px) scale(1.015);background-position:right center;box-shadow:0 17px 42px rgba(34,211,238,.24)}.resume-download-btn:hover:before{left:130%}.resume-download-icon{font-size:1.15rem;transition:transform .35s var(--ease)}.resume-download-btn:hover .resume-download-icon{transform:translateY(3px)}
          @keyframes resumeFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}@keyframes resumeRing{to{transform:rotate(360deg)}}@keyframes resumeGlow{to{transform:translate(-35px,35px) scale(1.15);opacity:.62}}
          @media(max-width:600px){.resume-card{flex-direction:column;text-align:center;padding:28px 20px}.resume-copy{width:100%}.resume-download-btn{width:100%}}
          '''
              css.write_text(c, encoding='utf-8')
          PY

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js css/styles.css
          git rm .github/workflows/apply-resume.yml
          git commit -m "Add complete resume tab and CV download [skip ci]"
          git push
